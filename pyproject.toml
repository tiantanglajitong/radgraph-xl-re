[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radgraph-xl-re"
version = "0.1.0"
description = "Transformer-based entity and relation extraction from RadGraph-XL radiology reports."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
radgraph-re = "radgraph_re.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

