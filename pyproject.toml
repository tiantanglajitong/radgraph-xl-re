[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radgraph-xl-re"
version = "0.1.0"
description = "Transformer-based entity and relation extraction from RadGraph-XL radiology reports."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]
ml = [
    "accelerate>=1.10,<2",
    "datasets>=4,<5",
    "matplotlib>=3.9,<4",
    "networkx>=3.4,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "python-dotenv>=1.1,<2",
    "pyyaml>=6,<7",
    "safetensors>=0.5,<1",
    "scikit-learn>=1.6,<2",
    "seaborn>=0.13,<1",
    "seqeval>=1.2,<2",
    "transformers>=4.57,<5",
]
notebook = [
    "ipykernel>=6.29,<8",
    "ipywidgets>=8.1,<9",
    "jupyterlab>=4.4,<5",
    "nbstripout>=0.8,<1",
]

[project.scripts]
radgraph-re = "radgraph_re.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
